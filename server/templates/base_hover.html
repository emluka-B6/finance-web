<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}User Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px; /* Adjust based on the height of your navbar */
        }

        /* Remove the triangle icon from the dropdown toggle */
        .navbar .nav-item.dropdown .dropdown-toggle::after {
            display: none; /* Hide the triangle */
        }

        /* Dropdown menu styling */
        .dropdown-menu {
            display: none; /* Initially hide the dropdown */
            background-color: #343a40; /* Same as navbar bg-dark */
            border: none; /* Remove border */
            margin-top: 0; /* No gap between the link and the menu */
            top: 100%; /* Position directly below the "Settings" link */
            position: absolute; /* Position the dropdown absolutely */              
        }

        /* Ensure proper positioning context */
        .navbar .nav-item.dropdown {
            position: static; /* Ensure correct positioning context */
        }

        /* Expand the hover area to include the dropdown menu */
        .navbar .nav-item.dropdown:hover > .dropdown-menu {
            display: block; /* Keep the dropdown visible */
            margin-top: 0;
        }

        /* Optional: Add a subtle shadow to the dropdown menu */
        .dropdown-menu {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Subtle shadow */
        }

        /* Dropdown item hover effect */
        .dropdown-menu .dropdown-item:hover,
        .dropdown-menu .dropdown-item:focus {
            background-color: #007bff; /* Highlight color */
            color: white;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var dropdowns = document.querySelectorAll('.dropdown');
  
           /*  dropdowns.forEach(function(dropdown) {
                dropdown.addEventListener('mouseenter', function() {
                    var dropdownMenu = this.querySelector('.dropdown-menu');
                    dropdownMenu.style.display = 'block';
                });
  
                dropdown.addEventListener('mouseleave', function() {
                    var dropdownMenu = this.querySelector('.dropdown-menu');
                    dropdownMenu.style.display = 'none';
                });
            }); */
        });
    </script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Stocks</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <!-- Admin-only Settings Dropdown -->
                    {% if current_user.is_authenticated and current_user.is_admin() %}
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="settingsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Settings
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="settingsDropdown">
                                <li>
                                    <a class="dropdown-item {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('user.index') }}">
                                        All Users
                                    </a>
                                </li>
                                <!-- <li><hr class="dropdown-divider"></li> Add a separator -->
                                <li>
                                    <a class="dropdown-item {% if request.endpoint == 'add_user' %}active{% endif %}" href="{{ url_for('user.add_user') }}">
                                        New User
                                    </a>
                                </li>
                            </ul>
                        </li>
                    {% endif %}

                    <!-- Add stock index links -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('table.wig20') }}">WIG20</a>
                    </li>
                </ul>
            </div>
            
            <!-- Right-aligned Logout button -->
            <div class="d-flex">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('user.logout') }}" class="btn btn-danger ms-3">Logout</a>
                {% else %}
                    <a href="{{ url_for('user.login') }}" class="btn btn-primary ms-3">Login</a>
                    <a href="{{ url_for('user.register') }}" class="btn btn-success ms-3">Register</a>            
                {% endif %}
            </div>            
        </div>
    </nav>

    <!-- Content Area -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Include Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
