{% extends "base.html" %}

{% block title %}Stocks chart (Lightweight Charts){% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/chart.css')}}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<div class="container text-center">
  <div class="position-relative d-flex align-items-center justify-content-center mb-3">
    <h3 class="mb-0" style="font-size: 1.25rem;">{{ name }}</h3>
    <button id="fav-btn" class="btn btn-link p-0 position-absolute end-0 top-50 translate-middle-y" title="Add to favorites">
      <i id="fav-icon"
         class="fa{{ 's' if is_favorite(symbol) else 'r' }} fa-star text-warning"
         style="font-size: 1.5rem;"></i>
    </button>
  </div>

  <div class="d-flex align-items-start">
    <!-- Custom vertical buttons -->
    <div class="d-flex flex-column me-3" style="gap: 6px;">
      <!-- Chart type buttons -->
      <button id="btn-line" class="btn btn-outline-dark p-0 d-flex 
              justify-content-center align-items-center" title="Line Chart" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 14 15 20 9"></polyline>
        </svg>
      </button>
      <button id="btn-candlestick" class="btn btn-outline-dark chart-btn-active p-0 d-flex 
              justify-content-center align-items-center" title="Candlestick Chart" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="4" height="18"></rect>
          <rect x="15" y="8" width="4" height="8"></rect>
        </svg>
      </button>
      <button id="btn-ohlc" class="btn btn-outline-dark p-0 d-flex 
              justify-content-center align-items-center" title="OHLC Chart" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" 
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="4" x2="6" y2="20"></line>
          <line x1="18" y1="4" x2="18" y2="20"></line>
          <line x1="6" y1="9" x2="12" y2="9"></line>
          <line x1="18" y1="15" x2="12" y2="15"></line>
        </svg>
      </button>
    
      <!-- Divider -->
      <hr class="my-1 button-divider">
    
      <!-- Interval buttons -->
      <button id="btn-30m" class="btn btn-outline-dark interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="30m" style="width: 32px; height: 32px;">
        30M
      </button>       
      <button id="btn-1h" class="btn btn-outline-dark interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="1h" style="width: 32px; height: 32px;">
        1H
      </button>
      <button id="btn-4h" class="btn btn-outline-dark interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="4h" style="width: 32px; height: 32px;">
        4H
      </button>
      <button id="btn-1d" class="btn btn-outline-dark chart-btn-active interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="1d" style="width: 32px; height: 32px;">
        1D
      </button>
      <button id="btn-1w" class="btn btn-outline-dark interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="1wk" style="width: 32px; height: 32px;">
        1W
      </button>      

      <!-- Divider -->
      <hr class="my-1 button-divider">

      <!-- Reset zoom button -->
      <button id="btn-reset-zoom" class="btn btn-outline-dark p-0 d-flex 
              justify-content-center align-items-center" title="Reset Zoom" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
    </div>
    

    <!-- Chart area -->
    <div class="flex-grow-1 card p-4 shadow-sm chart-container">
      <div id="stockChart"></div>
    </div>
  </div>
</div>


<!-- Lightweight Charts library (v3.7.0 - stable API) development build for debugging -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@3.7.0/dist/lightweight-charts.standalone.development.js"></script>

<script>
    // Pass server-rendered data to the external chart script
    window.CHART_CONFIG = {
        ohlcData: {{ ohlc_data | tojson | safe }},
        symbol: '{{ symbol }}',
        name: '{{ name }}'
    };
    
    // Debug: Check library loaded
    window.addEventListener('load', function() {
        console.log('Window loaded, LightweightCharts:', typeof LightweightCharts);
        if (typeof LightweightCharts !== 'undefined') {
            console.log('createChart:', typeof LightweightCharts.createChart);
            console.log('All exports:', Object.keys(LightweightCharts));
        }
    });
</script>
<script src="{{ url_for('static', filename='js/lightweightchart.js') }}"></script>
{% endblock %}
