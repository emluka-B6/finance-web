{% extends "chart_base.html" %}

{% block chart_title %}Stocks chart{% endblock %}

{% block chart_element %}
      <canvas id="stockChart" height="400"></canvas>
{% endblock %}

{% block chart_libraries %}
<!-- Chart.js core library (v4) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>

<!-- Luxon + adapter -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<!-- Hammer.js + zoom plugin -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
{% endblock %}

{% block chart_script %}
<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
{# <script src="{{ url_for('static', filename='js/linearchart.js') }}"></script> #}
{# <script src="{{ url_for('static', filename='js/basechartjs.js') }}"></script> #}
{% endblock %}
