{% extends "base.html" %}

{% block title %}Stocks chart{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/chart.css')}}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<div class="container text-center">
  <div class="d-inline-flex align-items-center justify-content-center mb-4">
    <h3 class="mb-0">{{ name }}</h3>
    <button id="fav-btn" class="btn btn-link p-0 ms-2" title="Add to favorites">
      <i id="fav-icon"
         class="fa{{ 's' if is_favorite(symbol) else 'r' }} fa-star text-warning"
         style="font-size: 1.5rem;"></i>
    </button>
  </div>

  <div class="d-flex align-items-start">
    <!-- Custom vertical buttons -->
    <div class="d-flex flex-column me-3" style="gap: 6px;">
      <!-- Chart type buttons -->
      <button id="btn-line" class="btn btn-outline-primary p-0 d-flex 
              justify-content-center align-items-center" title="Line Chart" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 14 15 20 9"></polyline>
        </svg>
      </button>
      <button id="btn-candlestick" class="btn btn-primary p-0 d-flex 
              justify-content-center align-items-center" title="Candlestick Chart" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="4" height="18"></rect>
          <rect x="15" y="8" width="4" height="8"></rect>
        </svg>
      </button>
      <button id="btn-ohlc" class="btn btn-outline-primary p-0 d-flex 
              justify-content-center align-items-center" title="OHLC Chart" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" 
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="4" x2="6" y2="20"></line>
          <line x1="18" y1="4" x2="18" y2="20"></line>
          <line x1="6" y1="9" x2="12" y2="9"></line>
          <line x1="18" y1="15" x2="12" y2="15"></line>
        </svg>
      </button>
    
      <!-- Divider -->
      <hr class="my-1 button-divider">
    
      <!-- Interval buttons -->
      <button id="btn-30m" class="btn btn-outline-primary interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="30m" style="width: 32px; height: 32px;">
        30M
      </button>       
      <button id="btn-1h" class="btn btn-outline-primary interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="1h" style="width: 32px; height: 32px;">
        1H
      </button>
      <button id="btn-4h" class="btn btn-outline-primary interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="4h" style="width: 32px; height: 32px;">
        4H
      </button>
      <button id="btn-1d" class="btn btn-primary interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="1d" style="width: 32px; height: 32px;">
        1D
      </button>
      <button id="btn-1w" class="btn btn-outline-primary interval-button p-0 d-flex 
              justify-content-center align-items-center" data-interval="1wk" style="width: 32px; height: 32px;">
        1W
      </button>      

      <!-- Divider -->
      <hr class="my-1 button-divider">

      <!-- Reset zoom button -->
      <button id="btn-reset-zoom" class="btn btn-outline-primary p-0 d-flex 
              justify-content-center align-items-center" title="Reset Zoom" style="width: 32px; height: 32px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
    </div>
    

    <!-- Chart area -->
    <div class="flex-grow-1 card p-4 shadow-sm">
      <canvas id="stockChart" height="400"></canvas>
    </div>
  </div>
</div>


<!-- Chart.js core library (v4) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>

<!-- Luxon + adapter -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<!-- Hammer.js + zoom plugin -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<script>
    // Pass server-rendered data to the external chart.js script
    window.CHART_CONFIG = {
        ohlcData: {{ ohlc_data | tojson | safe }},
        symbol: '{{ symbol }}',
        name: '{{ name }}'
    };
</script>
<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
{% endblock %}
